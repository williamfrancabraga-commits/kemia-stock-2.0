<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kemia Stock | Gestão Inteligente de Estoque</title>
<style>
:root{--navy:#12304a;--blue:#1769aa;--blue2:#eaf3fb;--ink:#1d2b38;--muted:#718096;--line:#e4eaf0;--bg:#f4f7fa;--green:#16845b;--red:#c34d4d;--amber:#b7791f;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,Segoe UI,Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;font-weight:600}
.app{display:flex;min-height:100vh}.sidebar{width:248px;background:var(--navy);color:#dbe7f1;padding:24px 16px;flex-shrink:0}.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 26px}.brandmark{width:38px;height:38px;border-radius:11px;background:#fff;color:var(--blue);display:grid;place-items:center;font-weight:900;font-size:20px}.brand b{display:block;font-size:17px;color:#fff;letter-spacing:.4px}.brand small{color:#a9bfd1;font-size:11px}.navlabel{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:#8ea9bf;padding:12px 10px 7px}.nav button{width:100%;text-align:left;background:transparent;color:#c9d8e5;margin:2px 0;padding:11px 12px;display:flex;gap:12px;align-items:center}.nav button:hover,.nav button.active{background:#214762;color:#fff}.nav .ico{width:20px;text-align:center;font-size:16px}.sidefoot{margin:35px 8px 0;padding-top:17px;border-top:1px solid #34536a;color:#9eb4c6;font-size:11px}
.main{flex:1;min-width:0}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:5}.crumb{font-size:13px;color:var(--muted)}.topright{display:flex;align-items:center;gap:15px}.demo{background:#fff4dd;color:#8c5c0b;padding:6px 10px;border-radius:20px;font-size:11px;font-weight:700}.avatar{width:34px;height:34px;background:var(--blue2);color:var(--blue);border-radius:50%;display:grid;place-items:center;font-weight:700}
.content{padding:27px 30px 45px;max-width:1500px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.pagehead h1{font-size:25px;margin:0 0 5px;color:#17344d}.pagehead p{margin:0;color:var(--muted)}.primary{background:var(--blue);color:#fff}.secondary{background:#edf3f8;color:#29465e}.outline{background:#fff;border:1px solid var(--line);color:#29465e}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:19px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:0 2px 8px #16324a08}.metric-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.metric-icon{width:32px;height:32px;border-radius:9px;background:var(--blue2);display:grid;place-items:center;color:var(--blue);font-size:16px}.metric{font-size:27px;font-weight:750;letter-spacing:-.8px;margin:10px 0 3px;color:#17344d}.sub{font-size:11px;color:var(--muted)}.sub strong{color:var(--red)}
.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:19px;margin-bottom:17px}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.panelhead h2{font-size:15px;margin:0;color:#203d55}.panelhead p{margin:3px 0 0;color:var(--muted);font-size:11px}.grid2{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.barrow{display:grid;grid-template-columns:105px 1fr 45px;gap:10px;align-items:center;margin:13px 0;font-size:12px}.barbg{height:9px;border-radius:20px;background:#edf1f5;overflow:hidden}.barfill{height:100%;border-radius:20px;background:#3987c4}.barfill.bad{background:#d77b73}.legend{display:flex;gap:15px;color:var(--muted);font-size:11px;margin-top:15px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:#3987c4}.dot.red{background:#d77b73}
.donutwrap{display:flex;align-items:center;gap:23px;justify-content:center;padding:10px 0}.donut{width:135px;height:135px;border-radius:50%;background:conic-gradient(var(--green) 0 25%,#e66e68 25% 100%);display:grid;place-items:center}.donut:after{content:"25%";width:93px;height:93px;background:white;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:750;color:#17344d}.donutlabels div{margin:9px 0;font-size:12px}.donutlabels b{display:block;font-size:17px}.pill{display:inline-block;padding:4px 8px;border-radius:20px;font-size:10px;font-weight:700}.ok{background:#e5f5ed;color:#16734f}.badpill{background:#fdeceb;color:#ae3d3d}.warn{background:#fff3dc;color:#95610c}
.tabletools{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px}.tabletools input,.tabletools select,.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;color:var(--ink)}.tabletools input{min-width:220px;flex:1}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:780px;font-size:12px}th{text-align:left;color:#657789;background:#f7f9fb;font-size:10px;text-transform:uppercase;letter-spacing:.4px;padding:11px 10px}td{padding:11px 10px;border-top:1px solid #edf1f4}tr:hover td{background:#fbfdff}.code{font-weight:700;color:#28618b}.muted{color:var(--muted)}
.mapgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.location{border:1px solid var(--line);border-radius:11px;padding:15px;display:flex;gap:12px;align-items:center}.locnum{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#17344d}.location h3{font-size:13px;margin:0 0 3px}.location p{margin:0;color:var(--muted);font-size:11px}.location .count{margin-left:auto;text-align:right;font-size:11px;color:var(--muted)}.loc1{background:#fce8e5}.loc2{background:#e5f1fa}.loc3{background:#e5f4eb}.loc4{background:#fff2d6}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:11px;color:#637587;font-weight:700}.field input,.field select{width:100%}.notice{background:#f0f6fb;border-left:3px solid #4b91c5;padding:11px 13px;color:#496276;font-size:12px;border-radius:5px;margin:10px 0 15px}.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.step{background:#edf4fa;border:1px solid #d7e5f0;border-radius:9px;padding:10px 12px;font-size:11px;font-weight:650}.arrow{color:#92a6b7}.abc{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.abcbox{padding:16px;border-radius:11px;background:#f6f9fb;border:1px solid var(--line)}.abcbox h3{margin:0;font-size:20px}.abcbox p{font-size:11px;color:var(--muted);margin:5px 0 0}
.toast{position:fixed;bottom:20px;right:22px;background:#17344d;color:#fff;padding:12px 17px;border-radius:10px;box-shadow:0 8px 25px #0002;display:none;z-index:20}.empty{padding:25px;text-align:center;color:var(--muted)}
@media(max-width:1000px){.sidebar{width:205px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:700px){.sidebar{width:62px;padding:15px 7px}.brand{padding:4px 5px 20px}.brandmark{width:42px}.brandtext,.navlabel,.nav button span:not(.ico),.sidefoot{display:none}.nav button{justify-content:center;padding:12px 5px}.topbar{padding:0 14px}.content{padding:20px 14px}.pagehead{flex-direction:column}.cards{gap:9px}.card{padding:12px}.metric{font-size:22px}.mapgrid,.formgrid,.abc{grid-template-columns:1fr}.topright{gap:8px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div class="brandmark">K</div><div class="brandtext"><b>KEMIA STOCK</b><small>Gestão inteligente de estoque</small></div></div>
 <div class="navlabel">Menu principal</div>
 <nav class="nav">
  <button class="active" data-page="dashboard"><span class="ico">▦</span><span>Visão geral</span></button>
  <button data-page="estoque"><span class="ico">▤</span><span>Controle de estoque</span></button>
  <button data-page="localizacao"><span class="ico">⌖</span><span>Mapa de localização</span></button>
  <button data-page="movimentacao"><span class="ico">⇄</span><span>Movimentações</span></button>
  <button data-page="relatorios"><span class="ico">▥</span><span>Relatórios e ABC</span></button>
 </nav>
 <div class="navlabel">Operação</div>
 <nav class="nav">
  <button data-page="processo"><span class="ico">◎</span><span>Fluxo operacional</span></button>
  <button data-page="sobre"><span class="ico">ⓘ</span><span>Sobre o projeto</span></button>
 </nav>
 <div class="sidefoot">Protótipo demonstrativo<br>Projeto Integrador · Kemia</div>
</aside>
<main class="main">
 <header class="topbar"><div class="crumb">Kemia Stock <span class="muted">/</span> <b id="crumb">Visão geral</b></div><div class="topright"><span class="demo">MODO DEMONSTRAÇÃO</span><span class="muted">Acesso livre</span></div></header>
 <div class="content" id="view"></div>
</main>
</div>
<div class="toast" id="toast"></div>
<script>
const inventory=[
["MT-0101","Tubo PVC 100mm - barra 6m","Contêiner 1",120,104,480,95,45600,62],
["MT-0102","Tubo PVC 150mm - barra 6m","Contêiner 1",80,80,260,148,38480,41],
["MT-0115","Conexão joelho 90° 100mm","Contêiner 1",340,298,1320,18.5,24420,88],
["MT-0120","Válvula esfera 2 polegadas","Fábrica",45,39,190,112,21280,54],
["MT-0134","Bomba dosadora 12 L/h","Fábrica",8,8,24,2850,68400,18],
["MT-0140","Motor elétrico 3 CV trifásico","Fábrica",6,5,18,3400,61200,15],
["MT-0155","Chapa aço inox 304 - 2mm","Pátio",32,27,145,620,89900,33],
["MT-0161","Perfil metalon 40x40","Pátio",210,188,840,58,48720,47],
["MT-0177","Eletrodo revestido 2,5mm - kg","Contêiner 2",75,75,310,32,9920,71],
["MT-0182","Manta geotêxtil - rolo 100m","Contêiner 2",14,11,52,890,46280,22],
["MT-0190","Geomembrana PEAD 1,0mm - m²","Contêiner 2",1200,1045,4800,46,220800,29],
["MT-0203","Painel de comando montado","Fábrica",5,5,16,8900,142400,14],
["MT-0215","Cabo PP 3x2,5mm² - metro","Contêiner 3",800,712,3200,9.8,31360,58],
["MT-0221","Disjuntor tripolar 32A","Contêiner 3",40,36,160,78,12480,44],
["MT-0230","Sensor de nível ultrassônico","Contêiner 3",12,12,36,1950,70200,19],
["MT-0244","Aerador submerso 5 CV","Pátio",4,3,14,6200,86800,11],
["MT-0250","Difusor de ar de membrana","Contêiner 4",260,221,980,42,41160,26],
["MT-0263","Parafuso inox M10x40 - unidade","Contêiner 4",1500,1318,6400,2.1,13440,93],
["MT-0271","Vedante de borracha EPDM - metro","Contêiner 4",180,162,720,14.5,10440,67],
["MT-0288","Tinta epóxi - galão 3,6L","Contêiner 4",28,25,96,285,27360,38]
];
const brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=n=>n.toLocaleString('pt-BR');
const sumERP=inventory.reduce((a,x)=>a+x[3],0),sumFis=inventory.reduce((a,x)=>a+x[4],0);
const mismatch=inventory.filter(x=>x[3]!==x[4]).length;
const pages={dashboard:"Visão geral",estoque:"Controle de estoque",localizacao:"Mapa de localização",movimentacao:"Movimentações",relatorios:"Relatórios e ABC",processo:"Fluxo operacional",sobre:"Sobre o projeto"};
let movements=[];
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2800)}
function go(p){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('crumb').textContent=pages[p];render(p);window.scrollTo(0,0)}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
function header(title,desc,action=''){return `<div class="pagehead"><div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function metrics(){return `<div class="cards">
<div class="card"><div class="metric-top">Acuracidade do estoque <span class="metric-icon">◉</span></div><div class="metric">68%</div><div class="sub"><strong>Indicador de linha de base</strong> informado na demanda</div></div>
<div class="card"><div class="metric-top">Tempo médio de separação <span class="metric-icon">◷</span></div><div class="metric">3h20min</div><div class="sub">Média de 15 separações cronometradas</div></div>
<div class="card"><div class="metric-top">Retrabalhos por mês <span class="metric-icon">↻</span></div><div class="metric">22</div><div class="sub">Registro manual do almoxarifado</div></div>
<div class="card"><div class="metric-top">Itens não localizados/mês <span class="metric-icon">⌖</span></div><div class="metric">17</div><div class="sub">Registro manual do almoxarifado</div></div>
</div>`}
function dashboard(){return header("Visão geral","Acompanhe a situação do estoque, os indicadores e os principais pontos de atenção.",`<button class="primary" onclick="go('estoque')">Consultar materiais　→</button>`)+metrics()+`
<div class="grid2">
<section class="panel"><div class="panelhead"><div><h2>Saldo por local de armazenamento</h2><p>Comparativo entre saldo registrado no ERP e contagem física</p></div></div>
${["Contêiner 1","Contêiner 2","Contêiner 3","Contêiner 4","Fábrica","Pátio"].map((l,i)=>{let rows=inventory.filter(x=>x[2]===l),e=rows.reduce((a,x)=>a+x[3],0),f=rows.reduce((a,x)=>a+x[4],0),pct=e?f/e*100:0;return `<div class="barrow"><span>${l}</span><div class="barbg"><div class="barfill ${pct<99?'bad':''}" style="width:${pct}%"></div></div><b>${pct.toFixed(0)}%</b></div>`}).join('')}
<div class="legend"><span><i class="dot"></i> Saldo físico em relação ao ERP</span><span><i class="dot red"></i> Com divergência</span></div></section>
<section class="panel"><div class="panelhead"><div><h2>Conferência da amostra</h2><p>20 materiais listados no Anexo A</p></div></div><div class="donutwrap"><div class="donut"></div><div class="donutlabels"><div><b>${mismatch}</b>itens com divergência</div><div><b>${20-mismatch}</b>itens sem divergência</div></div></div><div class="notice">A taxa de 25% representa os itens sem divergência na amostra (5 de 20). A acuracidade de 68% é o indicador de linha de base informado separadamente na demanda.</div></section>
</div>
<section class="panel"><div class="panelhead"><div><h2>Materiais que exigem atenção</h2><p>Maiores diferenças entre saldo ERP e saldo físico contado</p></div><button class="outline" onclick="go('estoque')">Ver todos</button></div>${tableRows(inventory.slice().sort((a,b)=>(b[3]-b[4])-(a[3]-a[4])).slice(0,5))}</section>`}
function tableRows(rows){return `<div class="tablewrap"><table><thead><tr><th>Código</th><th>Descrição</th><th>Local</th><th>Saldo ERP</th><th>Saldo físico</th><th>Diferença</th><th>Status</th></tr></thead><tbody>${rows.map(x=>`<tr><td class="code">${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${num(x[3])}</td><td>${num(x[4])}</td><td style="color:${x[3]===x[4]?'#16845b':'#c34d4d'};font-weight:700">${x[4]-x[3]}</td><td><span class="pill ${x[3]===x[4]?'ok':'badpill'}">${x[3]===x[4]?'OK':'DIVERGÊNCIA'}</span></td></tr>`).join('')}</tbody></table></div>`}
function estoque(){return header("Controle de estoque","Pesquise os 20 materiais da base demonstrativa e confira a diferença entre ERP e físico.",`<button class="primary" onclick="go('movimentacao')">＋ Nova movimentação</button>`)+`<section class="panel"><div class="tabletools"><input id="search" placeholder="Buscar por código ou descrição..." oninput="filterTable()"><select id="localfilter" onchange="filterTable()"><option value="">Todos os locais</option>${[...new Set(inventory.map(x=>x[2]))].map(x=>`<option>${x}</option>`).join('')}</select><select id="statusfilter" onchange="filterTable()"><option value="">Todos os status</option><option value="bad">Com divergência</option><option value="ok">Sem divergência</option></select><button class="outline" onclick="downloadCSV()">⇩ Exportar CSV</button></div><div id="inventorytable">${tableRows(inventory)}</div><p class="muted" style="font-size:11px;margin:12px 0 0">Base: Anexo A / planilha de controle. Os registros são demonstrativos e não sincronizam com o ERP.</p></section>`}
function filterTable(){let q=document.getElementById('search').value.toLowerCase(),l=document.getElementById('localfilter').value,s=document.getElementById('statusfilter').value;let rows=inventory.filter(x=>(x[0]+x[1]).toLowerCase().includes(q)&&(!l||x[2]===l)&&(!s||(s==='ok'&&x[3]===x[4])||(s==='bad'&&x[3]!==x[4])));document.getElementById('inventorytable').innerHTML=rows.length?tableRows(rows):'<div class="empty">Nenhum material encontrado.</div>'}
function localizacao(){let defs=[["Contêiner 1","Tubos e conexões de PVC","loc1"],["Contêiner 2","Eletrodo e geomembrana","loc2"],["Contêiner 3","Cabo, disjuntor e sensor","loc3"],["Contêiner 4","Difusor, parafuso, vedante e fita","loc4"],["Fábrica","Produção e materiais alocados à fábrica",""],["Pátio","Área de estoque e separação",""]];return header("Mapa de localização","Endereçamento de referência conforme o layout físico fornecido para a Kemia.")+`<section class="panel"><div class="panelhead"><div><h2>Áreas de armazenamento</h2><p>Selecione uma área para consultar os materiais associados</p></div></div><div class="mapgrid">${defs.map((d,i)=>{let r=inventory.filter(x=>x[2]===d[0]);return `<div class="location" onclick="showLocation('${d[0]}')" style="cursor:pointer"><div class="locnum ${d[2]}">${i<4?'0'+(i+1):'⌂'}</div><div><h3>${d[0]}</h3><p>${d[1]}</p></div><div class="count"><b>${r.length}</b><br>itens</div></div>`}).join('')}</div><div id="locdetail" class="notice">O layout de referência também identifica depósito de resíduos, recebimento/expedição, almoxarifado, escritório administrativo e sala de reunião.</div></section><section class="panel"><div class="panelhead"><div><h2>Referência do fluxo físico</h2><p>Entrada, armazenamento, separação e expedição</p></div></div><div class="flow"><span class="step">Recebimento / expedição</span><span class="arrow">→</span><span class="step">Conferência</span><span class="arrow">→</span><span class="step">Contêineres / fábrica / pátio</span><span class="arrow">→</span><span class="step">Almoxarifado</span><span class="arrow">→</span><span class="step">Envio à obra</span></div></section>`}
function showLocation(l){let r=inventory.filter(x=>x[2]===l);document.getElementById('locdetail').innerHTML=`<b>${l}:</b> ${r.length} materiais cadastrados — ${r.map(x=>x[0]+' '+x[1]).join('; ')}.`}
function movimentacao(){return header("Movimentações","Simule recebimentos, separações e devoluções. Os lançamentos ficam nesta demonstração durante a sessão.")+`<div class="grid2"><section class="panel"><div class="panelhead"><div><h2>Registrar movimentação</h2><p>Preencha os campos para adicionar um lançamento de demonstração</p></div></div><form id="moveform" onsubmit="addMove(event)"><div class="formgrid"><div class="field"><label>Tipo de movimentação</label><select id="mtype"><option>Entrada / recebimento</option><option>Saída / separação para obra</option><option>Devolução de obra</option><option>Ajuste / conferência</option></select></div><div class="field"><label>Data</label><input id="mdate" type="date" required></div><div class="field"><label>Material</label><select id="mitem">${inventory.map(x=>`<option value="${x[0]}">${x[0]} — ${x[1]}</option>`).join('')}</select></div><div class="field"><label>Quantidade</label><input id="mqty" type="number" min="1" required placeholder="Ex.: 10"></div><div class="field"><label>Destino / origem</label><input id="mdest" placeholder="Ex.: Obra / fornecedor"></div><div class="field"><label>Responsável</label><input id="mresp" placeholder="Nome do responsável"></div></div><div class="notice">A demonstração registra a movimentação na lista abaixo, mas não altera os saldos da planilha original nem integra com o ERP.</div><button class="primary" type="submit">Registrar movimentação</button></form></section><section class="panel"><div class="panelhead"><div><h2>Boas práticas de registro</h2><p>Etapas recomendadas para rastreabilidade</p></div></div><ol style="padding-left:18px;color:#506579;font-size:12px;line-height:2.1"><li>Conferir material e quantidade no recebimento.</li><li>Registrar corretamente no ERP.</li><li>Identificar o endereço de armazenamento.</li><li>Separar conforme lista/requisição da obra.</li><li>Conferir saldo físico com o ERP.</li><li>Registrar devoluções no ERP.</li></ol></section></div><section class="panel"><div class="panelhead"><div><h2>Histórico desta sessão</h2><p id="movcount">${movements.length} lançamentos</p></div><button class="outline" onclick="clearMoves()">Limpar histórico</button></div><div id="movtable">${moveTable()}</div></section>`}
function moveTable(){if(!movements.length)return '<div class="empty">Nenhuma movimentação registrada nesta sessão.</div>';return `<div class="tablewrap"><table><thead><tr><th>Data</th><th>Tipo</th><th>Material</th><th>Qtd.</th><th>Origem/destino</th><th>Responsável</th></tr></thead><tbody>${movements.map(m=>`<tr><td>${m.date}</td><td>${m.type}</td><td>${m.item}</td><td>${m.qty}</td><td>${m.dest||'—'}</td><td>${m.resp||'—'}</td></tr>`).join('')}</tbody></table></div>`}
function addMove(e){e.preventDefault();let id=document.getElementById('mitem').value;movements.unshift({date:document.getElementById('mdate').value,type:document.getElementById('mtype').value,item:id,qty:document.getElementById('mqty').value,dest:document.getElementById('mdest').value,resp:document.getElementById('mresp').value});document.getElementById('movtable').innerHTML=moveTable();document.getElementById('movcount').textContent=movements.length+' lançamentos';e.target.reset();toast('Movimentação adicionada à demonstração.')}
function clearMoves(){movements=[];document.getElementById('movtable').innerHTML=moveTable();document.getElementById('movcount').textContent='0 lançamentos'}
function relatorios(){let total=inventory.reduce((a,x)=>a+x[7],0);return header("Relatórios e classificação ABC","Consumo anual e valor de consumo conforme a tabela A.2 fornecida.")+`<div class="cards"><div class="card"><div class="metric-top">Valor de consumo anual <span class="metric-icon">R$</span></div><div class="metric" style="font-size:22px">${brl(total)}</div><div class="sub">Soma dos valores informados na tabela A.2</div></div><div class="card"><div class="metric-top">Saldo ERP total <span class="metric-icon">▤</span></div><div class="metric">${num(sumERP)}</div><div class="sub">Unidades nos 20 itens</div></div><div class="card"><div class="metric-top">Saldo físico total <span class="metric-icon">✓</span></div><div class="metric">${num(sumFis)}</div><div class="sub">Unidades contadas</div></div><div class="card"><div class="metric-top">Diferença total <span class="metric-icon">!</span></div><div class="metric">${num(sumERP-sumFis)}</div><div class="sub">Saldo ERP menos saldo físico</div></div></div><section class="panel"><div class="panelhead"><div><h2>Valor de consumo anual por material</h2><p>Valores da classificação ABC — tabela A.2</p></div></div>${inventory.slice().sort((a,b)=>b[7]-a[7]).map(x=>`<div class="barrow" style="grid-template-columns:180px 1fr 105px"><span>${x[0]}</span><div class="barbg"><div class="barfill" style="width:${x[7]/Math.max(...inventory.map(y=>y[7]))*100}%"></div></div><b>${brl(x[7])}</b></div>`).join('')}</section><section class="panel"><div class="panelhead"><div><h2>Classificação ABC</h2><p>Os dados de consumo e valor estão disponíveis; as faixas A/B/C devem ser definidas conforme o critério adotado no projeto.</p></div></div><div class="abc"><div class="abcbox"><h3>A</h3><p>Itens de maior impacto no valor acumulado. Priorizar controle e acompanhamento.</p></div><div class="abcbox"><h3>B</h3><p>Itens de impacto intermediário. Acompanhar consumo e reposição.</p></div><div class="abcbox"><h3>C</h3><p>Itens de menor impacto relativo. Padronizar reposição e conferência.</p></div></div><div class="notice">Este protótipo não atribui classes automaticamente, pois a planilha enviada apresenta os valores de consumo, mas não define os limites percentuais de cada classe.</div></section>`}
function processo(){let steps=["Recebimento do material","Conferência do material","Registro no ERP","Armazenamento do material","Solicitação de separação (lista/requisição)","Conferência no pátio","Localização e contagem manual","Conferência com ERP","Separação para a obra","Envio à obra","Registro da devolução no ERP (quando houver)","Encerrar processo"];return header("Fluxo operacional","Etapas organizadas a partir do fluxograma do Projeto Integrador.")+`<section class="panel"><div class="panelhead"><div><h2>Fluxo de recebimento à devolução</h2><p>O processo prevê tratamento de não conformidades e divergências antes de avançar.</p></div></div><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">${steps.map((s,i)=>`<div style="display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:12px"><div class="locnum loc${(i%4)+1}" style="flex-shrink:0">${String(i+1).padStart(2,'0')}</div><div style="font-size:12px;font-weight:650">${s}</div></div>`).join('')}</div><div class="notice"><b>Pontos de decisão do fluxograma:</b> material conferido corretamente? Registro realizado corretamente? Material localizado? Saldo físico igual ao saldo ERP? Houve devolução? Em caso negativo, registrar não conformidade, corrigir registro, solicitar regularização ou realizar nova conferência.</div></section>`}
function sobre(){return header("Sobre o Kemia Stock","Protótipo de demonstração do Projeto Integrador — produtividade no setor de estoque.")+`<section class="panel"><h2 style="margin-top:0">Contextualização</h2><p>A Kemia Tratamento de Efluentes cadastrou na plataforma SAGA SENAI de Inovação a demanda nº 12899 — “[PRODUTIVIDADE] Aumento da produtividade no setor de estoque”, vinculada ao SENAI/SC Xanxerê, área de atuação Logística, com vigência de 24 meses a partir de 24/07/2026.</p><p>O cenário descrito apresenta estoque distribuído entre quatro contêineres, fábrica e pátio, sem organização padronizada. Foram relatadas divergências entre registros do ERP e quantidades físicas, demora na conferência e separação, dificuldades no controle de devoluções e retrabalho para localizar itens.</p></section><section class="panel"><h2 style="margin-top:0">Proposta de valor</h2><div class="abc"><div class="abcbox"><h3>Localização</h3><p>Endereçamento visual e pesquisa por código ou descrição.</p></div><div class="abcbox"><h3>Conferência</h3><p>Comparação do saldo físico com o saldo registrado no ERP.</p></div><div class="abcbox"><h3>Padronização</h3><p>Registro de separações, movimentações e devoluções.</p></div></div></section><section class="panel"><h2 style="margin-top:0">Limites desta demonstração</h2><ul style="color:#5d7080;line-height:1.9"><li>Os dados apresentados são os dados demonstrativos fornecidos nos arquivos e imagens.</li><li>As movimentações ficam apenas na memória da página durante a sessão.</li><li>Não há login, banco de dados, integração com ERP ou sincronização em tempo real.</li><li>Os indicadores são linha de base informada e não metas futuras.</li></ul></section>`}
function downloadCSV(){let lines=[["Código","Descrição","Local","Saldo ERP","Saldo físico","Diferença"],...inventory.map(x=>[x[0],x[1],x[2],x[3],x[4],x[4]-x[3]])];let csv='\ufeff'+lines.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='kemia-stock-controle-estoque.csv';a.click();URL.revokeObjectURL(a.href);toast('Arquivo CSV exportado.')}
function render(p){let v=document.getElementById('view');v.innerHTML=({dashboard,estoque,localizacao,movimentacao,relatorios,processo,sobre}[p]||dashboard)();if(p==='movimentacao'){document.getElementById('mdate').value=new Date().toISOString().slice(0,10)}}
render('dashboard');
</script>
</body></html>
